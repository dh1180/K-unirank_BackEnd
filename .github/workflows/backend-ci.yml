name: Spring Boot CI

on:
  # Even documentation-only migration PRs must prove the Spring build still works.
  pull_request:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

jobs:
  backend-test:
    name: Build and test (Java 21, PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Verify tests
        run: mvn -B --no-transfer-progress verify
      - name: Build Railway Docker image
        working-directory: .
        run: docker build --tag kunirank-backend:ci .
