name: Spring Boot CI

on:
  # Even documentation-only migration PRs must prove the Spring build still works.
  pull_request:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "scripts/**"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

jobs:
  backend-test:
    name: Build and test (Java 21, PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Verify tests and build bootJar
        run: ./gradlew --no-daemon test bootJar
      - name: Build Railway Docker image
        working-directory: .
        run: docker build --tag kunirank-backend:ci .

  windows-powershell-parse:
    name: Parse staging script (Windows PowerShell 5.1)
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check UTF-8 BOM and parse using Windows PowerShell 5.1
        shell: powershell
        run: |
          $path = (Resolve-Path 'scripts/verify-staging.ps1').Path
          $bytes = [System.IO.File]::ReadAllBytes($path)
          if ($bytes.Length -lt 3 -or $bytes[0] -ne 239 -or $bytes[1] -ne 187 -or $bytes[2] -ne 191) {
            throw 'verify-staging.ps1 must retain the UTF-8 BOM for Windows PowerShell 5.1'
          }
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Host $_.ToString() }
            throw 'Windows PowerShell 5.1 cannot parse verify-staging.ps1'
          }
          Write-Host 'PASS: Windows PowerShell 5.1 can parse the staging script.'
